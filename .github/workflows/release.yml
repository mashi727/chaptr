name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: '成果物に付けるバージョン表記（省略時はブランチ/タグ名。例 v2.3.1）'
        required: false
        default: ''

env:
  VERSION: ${{ github.event.inputs.version || github.ref_name }}

jobs:
  build-macos-intel:
    runs-on: macos-15  # Intel x86_64 (macos-13 retired)

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # ref は起動元をそのまま使う。以前ここに version 入力を流用していたため、
          # 手動実行すると「バージョン表記」を git の ref として checkout しようとし、
          # 存在しないタグ（既定値 v2.1.0）で即失敗していた。存在するタグを入れた
          # 場合も、ブランチではなくそのタグの古いコードがビルドされてしまう。
          ref: ${{ github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install PySide6 PyYAML numpy opencv-python-headless psutil static-ffmpeg
          # static-ffmpegのバイナリをダウンロード
          python -c "import static_ffmpeg; static_ffmpeg.add_paths()"

      - name: Build with PyInstaller
        env:
          MACOSX_DEPLOYMENT_TARGET: '10.15'
        run: |
          pyinstaller chaptr.spec

      - name: Create DMG
        run: |
          # ブランチから手動実行すると ref_name に `/` が入り、ファイル名が壊れる
          # （try/segment-detect → ディレクトリ扱いになる）。区切りを潰しておく。
          VERSION="${{ github.event.inputs.version || github.ref_name }}"
          VERSION="${VERSION//\//-}"
          mkdir -p dmg_contents
          cp -r "dist/Chaptr.app" dmg_contents/
          sync
          # hdiutil は runner 上で "Resource busy" を散発する（Spotlight 等が
          # 掴んだまま離さない）。実際に Intel 側だけ落ちたことがあるので、
          # 待って数回やり直す。1回で決め打たない。
          for attempt in 1 2 3 4 5; do
            sleep $((attempt * 5))
            if hdiutil create -volname "Chaptr" \
                 -srcfolder dmg_contents \
                 -ov -format UDZO \
                 "Video-Chapter-Editor-${VERSION}-macOS-Intel.dmg"; then
              exit 0
            fi
            echo "hdiutil failed (attempt $attempt), retrying..."
          done
          echo "hdiutil create failed after 5 attempts"
          exit 1

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-intel-app
          path: "Video-Chapter-Editor-*-macOS-Intel.dmg"

  build-macos-arm:
    runs-on: macos-latest  # Apple Silicon (arm64)

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # ref は起動元をそのまま使う。以前ここに version 入力を流用していたため、
          # 手動実行すると「バージョン表記」を git の ref として checkout しようとし、
          # 存在しないタグ（既定値 v2.1.0）で即失敗していた。存在するタグを入れた
          # 場合も、ブランチではなくそのタグの古いコードがビルドされてしまう。
          ref: ${{ github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install PySide6 PyYAML numpy opencv-python-headless psutil static-ffmpeg
          # static-ffmpegのバイナリをダウンロード
          python -c "import static_ffmpeg; static_ffmpeg.add_paths()"

      - name: Build with PyInstaller
        env:
          MACOSX_DEPLOYMENT_TARGET: '11.0'
        run: |
          pyinstaller chaptr.spec

      - name: Create DMG
        run: |
          # ブランチから手動実行すると ref_name に `/` が入り、ファイル名が壊れる
          # （try/segment-detect → ディレクトリ扱いになる）。区切りを潰しておく。
          VERSION="${{ github.event.inputs.version || github.ref_name }}"
          VERSION="${VERSION//\//-}"
          mkdir -p dmg_contents
          cp -r "dist/Chaptr.app" dmg_contents/
          sync
          # hdiutil は runner 上で "Resource busy" を散発する（Spotlight 等が
          # 掴んだまま離さない）。実際に Intel 側だけ落ちたことがあるので、
          # 待って数回やり直す。1回で決め打たない。
          for attempt in 1 2 3 4 5; do
            sleep $((attempt * 5))
            if hdiutil create -volname "Chaptr" \
                 -srcfolder dmg_contents \
                 -ov -format UDZO \
                 "Video-Chapter-Editor-${VERSION}-macOS-AppleSilicon.dmg"; then
              exit 0
            fi
            echo "hdiutil failed (attempt $attempt), retrying..."
          done
          echo "hdiutil create failed after 5 attempts"
          exit 1

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-arm-app
          path: "Video-Chapter-Editor-*-macOS-AppleSilicon.dmg"

  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # ref は起動元をそのまま使う。以前ここに version 入力を流用していたため、
          # 手動実行すると「バージョン表記」を git の ref として checkout しようとし、
          # 存在しないタグ（既定値 v2.1.0）で即失敗していた。存在するタグを入れた
          # 場合も、ブランチではなくそのタグの古いコードがビルドされてしまう。
          ref: ${{ github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install nuitka ordered-set zstandard
          pip install PySide6 PyYAML numpy opencv-python-headless psutil static-ffmpeg
          # static-ffmpegのバイナリをダウンロード
          python -c "import static_ffmpeg; static_ffmpeg.add_paths()"

      - name: Get static-ffmpeg path
        id: ffmpeg-path
        run: |
          $ffmpeg_path = python -c "import static_ffmpeg, os; print(os.path.dirname(static_ffmpeg.__file__))"
          $bin_dir = Join-Path $ffmpeg_path "bin"
          echo "FFMPEG_BIN_DIR=$bin_dir" >> $env:GITHUB_OUTPUT

      - name: Build with Nuitka (onefile mode)
        run: |
          python -m nuitka `
            --standalone `
            --onefile `
            --assume-yes-for-downloads `
            --windows-console-mode=disable `
            --windows-icon-from-ico=assets/icon.ico `
            --enable-plugin=pyside6 `
            --include-package=chaptr `
            --include-package-data=chaptr `
            --include-module=cv2 `
            --include-module=psutil `
            --include-data-dir="${{ steps.ffmpeg-path.outputs.FFMPEG_BIN_DIR }}=static_ffmpeg/bin" `
            --output-filename=Chaptr.exe `
            --output-dir=dist `
            run_chaptr.py

      - name: Rename to versioned exe (single-file distribution)
        run: |
          $version = "${{ github.event.inputs.version }}"
          if (-not $version) { $version = "${{ github.ref_name }}" }
          # ブランチ名の `/` はファイル名に使えないので潰す
          $version = $version -replace '/', '-'
          # --onefile なので Chaptr.exe 単体で自己完結（ffmpeg も内包）。
          # zip 梱包せず、バージョン名を付けた exe をそのまま配布する。
          Copy-Item "dist/Chaptr.exe" "Video-Chapter-Editor-${version}-Windows.exe"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-app
          path: "Video-Chapter-Editor-*.exe"

  release:
    needs: [build-macos-intel, build-macos-arm, build-windows]
    runs-on: ubuntu-latest
    # リリース作成はタグ push のときだけ。ブランチから手動実行するのは
    # 動作確認用のビルドが欲しい場面で、そこでリリースやタグを作られると困る
    # （tag_name にブランチ名が入ってしまう）。成果物は Artifacts から取れる。
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write

    steps:
      - name: Download macOS Intel artifact
        uses: actions/download-artifact@v4
        with:
          name: macos-intel-app

      - name: Download macOS ARM artifact
        uses: actions/download-artifact@v4
        with:
          name: macos-arm-app

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: windows-app

      - name: Upload to Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.event.inputs.version || github.ref_name }}
          # semver のプレリリース（v2.3.1-rc1 のようにハイフンを含む）は
          # 正式版として出さない。Latest を上書きしてしまうため。
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            *.dmg
            *.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
